<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Render 3D en Canvas - Scanline, Ray Tracing y AO</title>
  <style>
    :root {
      --bg-dark: #0b1a13;
      --panel-bg: #132a1f;
      --border-green: #26543d;
      --accent-red: #d9383a;
      --accent-red-light: #ff6b6b;
      --accent-green: #4ecdc4;
      --text-light: #e6f2ec;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      color: var(--accent-red-light);
      margin-bottom: 12px;
      font-size: 1.5rem;
    }
    .controls {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-green);
      padding: 12px 18px;
      border-radius: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      margin-bottom: 20px;
    }
    select, input[type="number"], button {
      background-color: var(--bg-dark);
      color: var(--text-light);
      border: 1px solid var(--border-green);
      padding: 6px 10px;
      border-radius: 4px;
    }
    button {
      background-color: var(--accent-red);
      border-color: var(--accent-red-light);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    canvas {
      border: 2px solid var(--border-green);
      border-radius: 6px;
      background-color: #050d09;
      image-rendering: pixelated;
      width: 480px;
      height: 360px;
    }
  </style>
</head>
<body>

  <h1>Renderizador 3D: Scanline, Ray Tracing y Oclusión Ambiental</h1>

  <!-- Controles con número de muestras AO ajustable (Integrante 3) -->
  <div class="controls">
    <label>
      Técnica:
      <select id="techSelect">
        <option value="scanline" selected>1. Scanline (Z-Buffer + Sombreado Plano)</option>
        <option value="raytracing">2. Ray Tracing (Sombras + 1 Reflejo)</option>
        <option value="ao">3. Oclusión Ambiental (Muestreo Hemisferio)</option>
      </select>
    </label>

    <label>
      Muestras AO:
      <input type="number" id="aoSamples" value="16" min="4" max="128" step="4" style="width: 55px;">
    </label>

    <button id="btnRender">Renderizar</button>
  </div>

  <canvas id="renderCanvas" width="320" height="240"></canvas>

  <script>
    // =========================================================
    // 1. MATEMÁTICAS VECTORIALES 3D (Uso compartido del equipo)
    // =========================================================
    const Vec3 = {
      add: (a, b) => ({ x: a.x + b.x, y: a.y + b.y, z: a.z + b.z }),
      sub: (a, b) => ({ x: a.x - b.x, y: a.y - b.y, z: a.z - b.z }),
      mul: (a, s) => ({ x: a.x * s, y: a.y * s, z: a.z * s }),
      dot: (a, b) => a.x * b.x + a.y * b.y + a.z * b.z,
      cross: (a, b) => ({
        x: a.y * b.z - a.z * b.y,
        y: a.z * b.x - a.x * b.z,
        z: a.x * b.y - a.y * b.x
      }),
      len: (a) => Math.hypot(a.x, a.y, a.z),
      norm: (a) => {
        const l = Math.hypot(a.x, a.y, a.z) || 1;
        return { x: a.x / l, y: a.y / l, z: a.z / l };
      }
    };

    // =========================================================
    // 2. ESCENA BASE: OBJETOS, CÁMARA Y LUZ (Integrante 1)
    // =========================================================
    const scene = {
      camera: {
        pos: { x: 0, y: 0.6, z: 0 },
        fov: 60
      },
      light: {
        pos: { x: 2.5, y: 3.5, z: -1.2 },
        ambient: 0.22,
        diffuse: 0.78
      },
      bgColor: [11, 26, 19],
      plane: {
        y: -1.0,
        color: [34, 110, 68],
        reflectivity: 0.15
      },
      spheres: [
        { center: { x: -0.95, y: -0.15, z: -3.5 }, radius: 0.85, color: [215, 45, 55], reflectivity: 0.35 },
        { center: { x: 0.95, y: -0.35, z: -3.2 }, radius: 0.65, color: [46, 196, 118], reflectivity: 0.2 },
        { center: { x: -0.15, y: -0.68, z: -2.3 }, radius: 0.32, color: [242, 95, 76], reflectivity: 0.0 }
      ],
      cubes: [
        { center: { x: 0.1, y: -0.4, z: -4.3 }, size: 1.2, color: [26, 147, 111], reflectivity: 0.05 }
      ]
    };

    // =========================================================
    // 3. GENERACIÓN DE MALLAS DE TRIÁNGULOS (Integrante 1)
    // =========================================================
    function createSphereMesh(sphere, latBands = 14, lonBands = 14) {
      const tris = [];
      for (let lat = 0; lat < latBands; lat++) {
        const theta1 = (lat * Math.PI) / latBands;
        const theta2 = ((lat + 1) * Math.PI) / latBands;
        for (let lon = 0; lon < lonBands; lon++) {
          const phi1 = (lon * 2 * Math.PI) / lonBands;
          const phi2 = ((lon + 1) * 2 * Math.PI) / lonBands;

          const getPt = (t, p) => ({
            x: sphere.center.x + sphere.radius * Math.sin(t) * Math.cos(p),
            y: sphere.center.y + sphere.radius * Math.cos(t),
            z: sphere.center.z + sphere.radius * Math.sin(t) * Math.sin(p)
          });

          const p1 = getPt(theta1, phi1);
          const p2 = getPt(theta2, phi1);
          const p3 = getPt(theta2, phi2);
          const p4 = getPt(theta1, phi2);

          if (lat !== 0) tris.push({ v0: p1, v1: p2, v2: p4, color: sphere.color });
          if (lat !== latBands - 1) tris.push({ v0: p2, v1: p3, v2: p4, color: sphere.color });
        }
      }
      return tris;
    }

    function createCubeMesh(cube) {
      const h = cube.size / 2;
      const c = cube.center;
      const v = [
        { x: c.x - h, y: c.y - h, z: c.z + h },
        { x: c.x + h, y: c.y - h, z: c.z + h },
        { x: c.x + h, y: c.y + h, z: c.z + h },
        { x: c.x - h, y: c.y + h, z: c.z + h },
        { x: c.x - h, y: c.y - h, z: c.z - h },
        { x: c.x + h, y: c.y - h, z: c.z - h },
        { x: c.x + h, y: c.y + h, z: c.z - h },
        { x: c.x - h, y: c.y + h, z: c.z - h }
      ];
      const indices = [
        [0, 1, 2], [0, 2, 3], [1, 5, 6], [1, 6, 2],
        [5, 4, 7], [5, 7, 6], [4, 0, 3], [4, 3, 7],
        [3, 2, 6], [3, 6, 7], [4, 5, 1], [4, 1, 0]
      ];
      return indices.map(idx => ({
        v0: v[idx[0]], v1: v[idx[1]], v2: v[idx[2]], color: cube.color
      }));
    }

    function createPlaneMesh(y, color) {
      const tris = [];
      const size = 6, steps = 10;
      const stepSize = (size * 2) / steps;
      for (let i = 0; i < steps; i++) {
        for (let j = 0; j < steps; j++) {
          const x1 = -size + i * stepSize;
          const x2 = x1 + stepSize;
          const z1 = -1.2 - j * stepSize;
          const z2 = z1 - stepSize;
          const p1 = { x: x1, y, z: z1 }, p2 = { x: x1, y, z: z2 };
          const p3 = { x: x2, y, z: z2 }, p4 = { x: x2, y, z: z1 };
          tris.push({ v0: p1, v1: p2, v2: p3, color });
          tris.push({ v0: p1, v1: p3, v2: p4, color });
        }
      }
      return tris;
    }

    // =========================================================
    // 4. SCANLINE: Z-BUFFER Y SOMBREADO PLANO (Integrante 1)
    // =========================================================
    function renderScanline(ctx, width, height) {
      const imgData = ctx.createImageData(width, height);
      const data = imgData.data;
      const zBuffer = new Float32Array(width * height).fill(Infinity);

      for (let i = 0; i < width * height; i++) {
        data[i * 4]     = scene.bgColor[0];
        data[i * 4 + 1] = scene.bgColor[1];
        data[i * 4 + 2] = scene.bgColor[2];
        data[i * 4 + 3] = 255;
      }

      let triangles = createPlaneMesh(scene.plane.y, scene.plane.color);
      for (const cube of scene.cubes) {
        triangles = triangles.concat(createCubeMesh(cube));
      }
      for (const sphere of scene.spheres) {
        triangles = triangles.concat(createSphereMesh(sphere, 14, 14));
      }

      const aspect = width / height;
      const fovRad = (scene.camera.fov * Math.PI) / 180;
      const f = 1 / Math.tan(fovRad / 2);

      function projectVertex(v) {
        const rel = Vec3.sub(v, scene.camera.pos);
        const zDist = -rel.z;
        if (zDist <= 0.1) return null;
        const xProj = (rel.x * f) / (aspect * zDist);
        const yProj = (rel.y * f) / zDist;
        return {
          sx: (xProj + 1) * 0.5 * width,
          sy: (1 - yProj) * 0.5 * height,
          z: zDist
        };
      }

      for (const tri of triangles) {
        const p0 = projectVertex(tri.v0);
        const p1 = projectVertex(tri.v1);
        const p2 = projectVertex(tri.v2);
        if (!p0 || !p1 || !p2) continue;

        const e1 = Vec3.sub(tri.v1, tri.v0);
        const e2 = Vec3.sub(tri.v2, tri.v0);
        let normal = Vec3.norm(Vec3.cross(e1, e2));

        const centroid = {
          x: (tri.v0.x + tri.v1.x + tri.v2.x) / 3,
          y: (tri.v0.y + tri.v1.y + tri.v2.y) / 3,
          z: (tri.v0.z + tri.v1.z + tri.v2.z) / 3
        };

        const toCam = Vec3.sub(scene.camera.pos, centroid);
        if (Vec3.dot(normal, toCam) < 0) normal = Vec3.mul(normal, -1);

        const lightDir = Vec3.norm(Vec3.sub(scene.light.pos, centroid));
        const diff = Math.max(0, Vec3.dot(normal, lightDir));
        const intensity = scene.light.ambient + scene.light.diffuse * diff;

        const rCol = Math.min(255, tri.color[0] * intensity);
        const gCol = Math.min(255, tri.color[1] * intensity);
        const bCol = Math.min(255, tri.color[2] * intensity);

        const pts = [p0, p1, p2].sort((a, b) => a.sy - b.sy);
        const [A, B, C] = pts;

        const totalHeight = C.sy - A.sy;
        if (totalHeight < 0.5) continue;

        const yStart = Math.max(0, Math.ceil(A.sy));
        const yEnd   = Math.min(height - 1, Math.floor(C.sy));

        for (let y = yStart; y <= yEnd; y++) {
          const secondHalf = y > B.sy || B.sy === A.sy;
          const segmentHeight = secondHalf ? (C.sy - B.sy) : (B.sy - A.sy);
          if (segmentHeight === 0) continue;

          const alpha = (y - A.sy) / totalHeight;
          const beta  = (y - (secondHalf ? B.sy : A.sy)) / segmentHeight;

          let xLeft  = A.sx + (C.sx - A.sx) * alpha;
          let zLeft  = A.z  + (C.z  - A.z)  * alpha;

          let xRight = secondHalf
            ? B.sx + (C.sx - B.sx) * beta
            : A.sx + (B.sx - A.sx) * beta;
          let zRight = secondHalf
            ? B.z  + (C.z  - B.z)  * beta
            : A.z  + (B.z  - A.z)  * beta;

          if (xLeft > xRight) {
            [xLeft, xRight] = [xRight, xLeft];
            [zLeft, zRight] = [zRight, zLeft];
          }

          const xStart = Math.max(0, Math.ceil(xLeft));
          const xEnd   = Math.min(width - 1, Math.floor(xRight));
          const spanWidth = xRight - xLeft;

          for (let x = xStart; x <= xEnd; x++) {
            const t = spanWidth > 0 ? (x - xLeft) / spanWidth : 0;
            const z = zLeft + (zRight - zLeft) * t;
            const idx = y * width + x;

            if (z < zBuffer[idx]) {
              zBuffer[idx] = z;
              data[idx * 4]     = rCol;
              data[idx * 4 + 1] = gCol;
              data[idx * 4 + 2] = bCol;
            }
          }
        }
      }

      ctx.putImageData(imgData, 0, 0);
    }

    // =========================================================
    // 5. RAY TRACING: INTERSECCIONES, SOMBRAS Y REFLEJO (Integrante 2)
    // =========================================================
    function intersectScene(origin, dir) {
      let closestT = Infinity;
      let hitObj = null;
      let hitNormal = null;

      for (const s of scene.spheres) {
        const oc = Vec3.sub(origin, s.center);
        const b = 2 * Vec3.dot(oc, dir);
        const c = Vec3.dot(oc, oc) - s.radius * s.radius;
        const disc = b * b - 4 * c;
        if (disc > 0) {
          const t = (-b - Math.sqrt(disc)) / 2;
          if (t > 0.001 && t < closestT) {
            closestT = t;
            hitObj = s;
            const hitPt = Vec3.add(origin, Vec3.mul(dir, t));
            hitNormal = Vec3.norm(Vec3.sub(hitPt, s.center));
          }
        }
      }

      for (const cube of scene.cubes) {
        const h = cube.size / 2;
        const minB = { x: cube.center.x - h, y: cube.center.y - h, z: cube.center.z - h };
        const maxB = { x: cube.center.x + h, y: cube.center.y + h, z: cube.center.z + h };

        let tmin = -Infinity, tmax = Infinity;
        for (const axis of ['x', 'y', 'z']) {
          if (Math.abs(dir[axis]) > 1e-6) {
            let t1 = (minB[axis] - origin[axis]) / dir[axis];
            let t2 = (maxB[axis] - origin[axis]) / dir[axis];
            if (t1 > t2) [t1, t2] = [t2, t1];
            tmin = Math.max(tmin, t1);
            tmax = Math.min(tmax, t2);
          } else if (origin[axis] < minB[axis] || origin[axis] > maxB[axis]) {
            tmin = Infinity;
            break;
          }
        }

        if (tmax >= tmin && tmin > 0.001 && tmin < closestT) {
          closestT = tmin;
          hitObj = cube;
          const hitPt = Vec3.add(origin, Vec3.mul(dir, tmin));
          const eps = 1e-3;
          if (Math.abs(hitPt.x - minB.x) < eps) hitNormal = { x: -1, y: 0, z: 0 };
          else if (Math.abs(hitPt.x - maxB.x) < eps) hitNormal = { x: 1, y: 0, z: 0 };
          else if (Math.abs(hitPt.y - minB.y) < eps) hitNormal = { x: 0, y: -1, z: 0 };
          else if (Math.abs(hitPt.y - maxB.y) < eps) hitNormal = { x: 0, y: 1, z: 0 };
          else if (Math.abs(hitPt.z - minB.z) < eps) hitNormal = { x: 0, y: 0, z: -1 };
          else hitNormal = { x: 0, y: 0, z: 1 };
        }
      }

      if (Math.abs(dir.y) > 1e-5) {
        const t = (scene.plane.y - origin.y) / dir.y;
        if (t > 0.001 && t < closestT) {
          const hitPt = Vec3.add(origin, Vec3.mul(dir, t));
          if (hitPt.z < -1.0 && hitPt.z > -14.0 && Math.abs(hitPt.x) < 7.0) {
            closestT = t;
            const isAlt = (Math.floor(hitPt.x) + Math.floor(hitPt.z)) % 2 === 0;
            hitObj = {
              color: isAlt ? scene.plane.color : [22, 78, 48],
              reflectivity: scene.plane.reflectivity
            };
            hitNormal = { x: 0, y: 1, z: 0 };
          }
        }
      }

      if (!hitObj) return null;
      return {
        t: closestT,
        point: Vec3.add(origin, Vec3.mul(dir, closestT)),
        normal: hitNormal,
        color: hitObj.color,
        reflectivity: hitObj.reflectivity || 0
      };
    }

    function traceRay(origin, dir, depth = 0) {
      const hit = intersectScene(origin, dir);
      if (!hit) return scene.bgColor;

      const lightVec = Vec3.sub(scene.light.pos, hit.point);
      const lightDist = Vec3.len(lightVec);
      const lightDir = Vec3.norm(lightVec);

      const shadowOrigin = Vec3.add(hit.point, Vec3.mul(hit.normal, 0.002));
      const shadowHit = intersectScene(shadowOrigin, lightDir);
      const inShadow = shadowHit && shadowHit.t < lightDist;

      const diff = inShadow ? 0 : Math.max(0, Vec3.dot(hit.normal, lightDir));
      const intensity = scene.light.ambient + scene.light.diffuse * diff;

      let localColor = [
        hit.color[0] * intensity,
        hit.color[1] * intensity,
        hit.color[2] * intensity
      ];

      if (depth < 1 && hit.reflectivity > 0) {
        const dotDN = Vec3.dot(dir, hit.normal);
        const reflDir = Vec3.norm(Vec3.sub(dir, Vec3.mul(hit.normal, 2 * dotDN)));
        const reflOrigin = Vec3.add(hit.point, Vec3.mul(hit.normal, 0.002));
        const reflColor = traceRay(reflOrigin, reflDir, depth + 1);
        const r = hit.reflectivity;
        localColor = [
          localColor[0] * (1 - r) + reflColor[0] * r,
          localColor[1] * (1 - r) + reflColor[1] * r,
          localColor[2] * (1 - r) + reflColor[2] * r
        ];
      }

      return localColor;
    }

    function renderRayTracing(ctx, width, height) {
      const imgData = ctx.createImageData(width, height);
      const data = imgData.data;
      const aspect = width / height;
      const fovScale = Math.tan(((scene.camera.fov * Math.PI) / 180) / 2);

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const px = (2 * ((x + 0.5) / width) - 1) * aspect * fovScale;
          const py = (1 - 2 * ((y + 0.5) / height)) * fovScale;
          const rayDir = Vec3.norm({ x: px, y: py, z: -1 });

          const col = traceRay(scene.camera.pos, rayDir, 0);
          const idx = (y * width + x) * 4;
          data[idx]     = Math.min(255, col[0]);
          data[idx + 1] = Math.min(255, col[1]);
          data[idx + 2] = Math.min(255, col[2]);
          data[idx + 3] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    // =========================================================
    // 6. OCLUSIÓN AMBIENTAL: MUESTREO HEMISFÉRICO (Integrante 3)
    // =========================================================
    function randomHemisphereDir(normal) {
      while (true) {
        const v = {
          x: Math.random() * 2 - 1,
          y: Math.random() * 2 - 1,
          z: Math.random() * 2 - 1
        };
        if (Vec3.dot(v, v) <= 1) {
          const dir = Vec3.norm(v);
          return Vec3.dot(dir, normal) < 0 ? Vec3.mul(dir, -1) : dir;
        }
      }
    }

    function renderAmbientOcclusion(ctx, width, height, samples = 16) {
      const imgData = ctx.createImageData(width, height);
      const data = imgData.data;
      const aspect = width / height;
      const fovScale = Math.tan(((scene.camera.fov * Math.PI) / 180) / 2);
      const aoRadius = 1.6; // Radio de alcance de oclusión

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const px = (2 * ((x + 0.5) / width) - 1) * aspect * fovScale;
          const py = (1 - 2 * ((y + 0.5) / height)) * fovScale;
          const rayDir = Vec3.norm({ x: px, y: py, z: -1 });

          const hit = intersectScene(scene.camera.pos, rayDir);
          const idx = (y * width + x) * 4;

          if (!hit) {
            data[idx]     = scene.bgColor[0];
            data[idx + 1] = scene.bgColor[1];
            data[idx + 2] = scene.bgColor[2];
            data[idx + 3] = 255;
            continue;
          }

          let occluded = 0;
          const origin = Vec3.add(hit.point, Vec3.mul(hit.normal, 0.003));
          for (let s = 0; s < samples; s++) {
            const sampleDir = randomHemisphereDir(hit.normal);
            const aoHit = intersectScene(origin, sampleDir);
            if (aoHit && aoHit.t < aoRadius) {
              occluded++;
            }
          }

          const accessibility = 1 - (occluded / samples);
          data[idx]     = Math.min(255, hit.color[0] * accessibility);
          data[idx + 1] = Math.min(255, hit.color[1] * accessibility);
          data[idx + 2] = Math.min(255, hit.color[2] * accessibility);
          data[idx + 3] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    // =========================================================
    // 7. INICIALIZACIÓN Y EVENTOS BÁSICOS
    // =========================================================
    const canvas = document.getElementById('renderCanvas');
    const ctx = canvas.getContext('2d');
    const techSelect = document.getElementById('techSelect');
    const aoSamplesInput = document.getElementById('aoSamples');

    function updateCanvas() {
      const tech = techSelect.value;
      const samples = parseInt(aoSamplesInput.value, 10) || 16;
      if (tech === 'scanline') {
        renderScanline(ctx, canvas.width, canvas.height);
      } else if (tech === 'raytracing') {
        renderRayTracing(ctx, canvas.width, canvas.height);
      } else if (tech === 'ao') {
        renderAmbientOcclusion(ctx, canvas.width, canvas.height, samples);
      }
    }

    document.getElementById('btnRender').addEventListener('click', updateCanvas);
    techSelect.addEventListener('change', updateCanvas);

    renderScanline(ctx, canvas.width, canvas.height);
  </script>
</body>
</html>
